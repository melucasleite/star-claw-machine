      // ---------- claw ----------

      function meshFromBody(body, mat) {
        const g = new THREE.Group();
        body.shapes.forEach((s, i) => {
          let geo;
          if (s instanceof CANNON.Box) {
            const e = s.halfExtents;
            geo = new THREE.BoxGeometry(e.x * 2, e.y * 2, e.z * 2);
          } else {
            geo = new THREE.CylinderGeometry(
              s.radiusTop,
              s.radiusBottom,
              s.height,
              16,
            );
          }
          const m = new THREE.Mesh(geo, mat);
          m.position.copy(body.shapeOffsets[i]);
          m.quaternion.copy(body.shapeOrientations[i]);
          m.castShadow = true;
          g.add(m);
        });
        scene.add(g);
        return g;
      }

      // The hub is kinematic: we drive it like the gantry motors would.
      const hub = new CANNON.Body({
        type: CANNON.Body.KINEMATIC,
        material: mats.claw,
        collisionFilterGroup: G_CLAW,
        collisionFilterMask: G_PRIZE,
      });
      hub.addShape(new CANNON.Cylinder(0.38, 0.38, 0.4, 12));
      hub.position.set(CHUTE.x, CLAW.topY, CHUTE.z);
      world.addBody(hub);
      const hubMesh = meshFromBody(hub, M.brass);

      // Three prongs on hinges, each driven by a torque-limited servo. The torque limit is the grip.
      const prongs = [];
      for (let i = 0; i < 3; i++) {
        const phi = (i / 3) * Math.PI * 2 + Math.PI / 6;
        const radial = new CANNON.Vec3(Math.cos(phi), 0, Math.sin(phi));
        const axis = new CANNON.Vec3(-Math.sin(phi), 0, Math.cos(phi));
        // Local frame: +x points outward, +z is the hinge axis.
        const q0 = new CANNON.Quaternion().setFromAxisAngle(
          new CANNON.Vec3(0, 1, 0),
          -phi,
        );
        const pivot = new CANNON.Vec3(radial.x * 0.32, -0.15, radial.z * 0.32);
        const body = new CANNON.Body({
          mass: 0.25,
          material: mats.claw,
          collisionFilterGroup: G_CLAW,
          collisionFilterMask: G_STATIC | G_PRIZE,
          angularDamping: 0.4,
        });
        const zAxis = new CANNON.Vec3(0, 0, 1);
        body.addShape(
          new CANNON.Box(new CANNON.Vec3(0.06, 0.5, 0.09)),
          new CANNON.Vec3(0.17, -0.47, 0),
          new CANNON.Quaternion().setFromAxisAngle(zAxis, 0.35),
        );
        body.addShape(
          new CANNON.Box(new CANNON.Vec3(0.06, 0.3, 0.1)),
          new CANNON.Vec3(0.2, -1.15, 0),
          new CANNON.Quaternion().setFromAxisAngle(zAxis, -0.65),
        );
        body.position.copy(hub.position.vadd(pivot));
        body.quaternion.copy(q0);
        world.addBody(body);
        world.addConstraint(
          new CANNON.HingeConstraint(hub, body, {
            pivotA: pivot,
            axisA: axis,
            pivotB: new CANNON.Vec3(0, 0, 0),
            axisB: zAxis,
          }),
        );
        prongs.push({
          body,
          axis,
          q0inv: q0.conjugate(),
          mesh: meshFromBody(body, M.brass),
          angle: 0,
        });
      }
      const prongBodies = new Set(prongs.map((p) => p.body));

      const claw = { closing: false, torque: CLAW.openTorque };

      function prongAngle(p) {
        const q = p.q0inv.mult(p.body.quaternion);
        return 2 * Math.atan2(q.z, q.w);
      }

      function driveProngs() {
        const target = claw.closing ? CLAW.closedAngle : CLAW.openAngle;
        const limit = claw.closing ? claw.torque : CLAW.openTorque;
        for (const p of prongs) {
          p.angle = prongAngle(p);
          const w = p.body.angularVelocity.dot(p.axis);
          const tau = Math.max(
            -limit,
            Math.min(limit, CLAW.kp * (target - p.angle) - CLAW.kd * w),
          );
          p.body.torque.vadd(p.axis.scale(tau), p.body.torque);
        }
      }

      // ---------- plushies ----------

      const sphereGeo = new THREE.SphereGeometry(1, 24, 16);
      const coneGeo = new THREE.ConeGeometry(1, 2, 16);

      // Knitted yarn: a tile of stockinette "V" stitches, drawn once as a colour map (soft shading
      // between the stitches) and a bump map (each leg of the V puffs up like a strand of yarn).
      const KNIT = { cols: 4, rows: 4, cell: 32, stitchW: 0.06, stitchH: 0.05 };
      function knitCanvas(bump) {
        const size = KNIT.cols * KNIT.cell;
        const cv = document.createElement("canvas");
        cv.width = cv.height = size;
        const c = cv.getContext("2d");
        c.fillStyle = bump ? "#000" : "#c6c6c6";
        c.fillRect(0, 0, size, size);
        const leg = (x, y, rot) => {
          const g = c.createRadialGradient(0, 0, 1, 0, 0, 15);
          g.addColorStop(0, bump ? "#fff" : "#ffffff");
          g.addColorStop(0.6, bump ? "#aaa" : "#ececec");
          g.addColorStop(1, bump ? "#000" : "#d2d2d2");
          c.save();
          c.translate(x, y);
          c.rotate(rot);
          c.scale(0.48, 1);
          c.fillStyle = g;
          c.beginPath();
          c.arc(0, 0, 15, 0, Math.PI * 2);
          c.fill();
          c.restore();
        };
        // Draw a row above and below the tile too, so the stitches wrap without a seam.
        for (let row = -1; row <= KNIT.rows; row++)
          for (let col = 0; col < KNIT.cols; col++) {
            const cx = col * KNIT.cell + KNIT.cell / 2;
            const cy = row * KNIT.cell + KNIT.cell / 2;
            leg(cx - 7, cy, -0.5);
            leg(cx + 7, cy, 0.5);
          }
        // A little fuzz so it reads as yarn, not plastic.
        for (let i = 0; i < 900; i++) {
          c.fillStyle = `rgba(${bump ? "0,0,0" : "90,90,90"},${Math.random() * 0.12})`;
          c.fillRect(Math.random() * size, Math.random() * size, 1, 2);
        }
        return cv;
      }
      const knitMap = new THREE.CanvasTexture(knitCanvas(false));
      knitMap.colorSpace = THREE.SRGBColorSpace;
      const knitBump = new THREE.CanvasTexture(knitCanvas(true));
      for (const t of [knitMap, knitBump]) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = 4;
      }
      const yarn = (color) =>
        new THREE.MeshStandardMaterial({
          color,
          roughness: 1,
          map: knitMap,
          bumpMap: knitBump,
          bumpScale: 2.2,
        });

      // Every part shares the same stitch size, so each scaled sphere or cone gets UVs that repeat
      // the tile by its own size. Geometries are cached per repeat count.
      const knitGeos = {};
      function knitGeo(p) {
        const sx = p.r * p.s[0];
        const sy = p.r * p.s[1];
        const sz = p.r * p.s[2];
        const around = Math.PI * (sx + sz);
        const tall = p.cone ? 2 * sy : Math.PI * sy;
        const u = Math.max(1, Math.round(around / KNIT.stitchW / KNIT.cols));
        const v = Math.max(1, Math.round(tall / KNIT.stitchH / KNIT.rows));
        const key = `${p.cone ? "c" : "s"}${u}x${v}`;
        if (knitGeos[key]) return knitGeos[key];
        const geo = (p.cone ? coneGeo : sphereGeo).clone();
        const uv = geo.attributes.uv;
        for (let i = 0; i < uv.count; i++)
          uv.setXY(i, uv.getX(i) * u, uv.getY(i) * v);
        return (knitGeos[key] = geo);
      }

      const DECO = {
        cream: yarn(0xfff4e2),
        pink: yarn(0xf7a8b8),
        beak: yarn(0xf2a65a),
        // Button eyes: smooth and a little shiny against the yarn.
        dark: std(0x161616, 0.25),
      };
      const KNITTED = new Set(["fur", "accent", "cream", "pink", "beak"]);
      for (const t of TIERS) {
        t.mats = {
          // The warm lamp and tone mapping wash pastels out, so the 3D fur gets a little extra saturation.
          fur: yarn(new THREE.Color(t.color).offsetHSL(0, 0.28, 0)),
          accent: yarn(
            new THREE.Color(t.color).lerp(new THREE.Color(0x3a2a1a), 0.22),
          ),
        };
      }
      const plushies = [];
      const pick = (list) => list[Math.floor(Math.random() * list.length)];

      // Squash-and-stretch spring: impacts flatten it, then it puffs back up slowly, with barely a wobble.
      const SQUISH = { stiffness: 150, damping: 20, kick: 0.75, max: 0.25 };

      function addPlush(tier, animal, x, y, z) {
        const body = new CANNON.Body({
          mass: 1,
          material: mats.prize,
          collisionFilterGroup: G_PRIZE,
          collisionFilterMask: PRIZE_MASK,
          // Cotton drags: plushies slump and settle instead of rolling around.
          linearDamping: 0.22,
          angularDamping: 0.55,
        });
        const group = new THREE.Group();
        for (const p of animal.parts) {
          if (p.solid)
            body.addShape(
              new CANNON.Sphere(p.r),
              new CANNON.Vec3(p.x, p.y, p.z),
            );
          if (!p.visible) continue;
          const m = new THREE.Mesh(
            KNITTED.has(p.mat) ? knitGeo(p) : p.cone ? coneGeo : sphereGeo,
            tier.mats[p.mat] ?? DECO[p.mat],
          );
          m.scale.set(p.r * p.s[0], p.r * p.s[1], p.r * p.s[2]);
          m.position.set(p.x, p.y, p.z);
          if (p.rot) m.rotation.set(...p.rot);
          m.castShadow = p.mat === "fur" || p.mat === "accent";
          m.receiveShadow = true;
          group.add(m);
        }
        body.position.set(x, y, z);
        body.quaternion.setFromEuler(
          Math.random() * 6.28,
          Math.random() * 6.28,
          Math.random() * 6.28,
        );
        world.addBody(body);
        // The root carries position and a world-vertical squash; the inner group carries rotation.
        const root = new THREE.Group();
        root.add(group);
        scene.add(root);
        const plush = { body, root, group, tier, animal, ghost: false };
        plush.squash = { a: 0, v: 0 };
        body.addEventListener("collide", (e) => {
          const hit = Math.abs(e.contact.getImpactVelocityAlongNormal());
          if (hit > 0.4) plush.squash.v += Math.min(hit, 6) * SQUISH.kick;
        });
        plushies.push(plush);
      }

      function jiggle(dt) {
        for (const { squash: q } of plushies) {
          q.v += (-SQUISH.stiffness * q.a - SQUISH.damping * q.v) * dt;
          q.a = Math.max(-SQUISH.max, Math.min(SQUISH.max, q.a + q.v * dt));
        }
      }

      function removePlush(plush) {
        world.removeBody(plush.body);
        scene.remove(plush.root);
        plushies.splice(plushies.indexOf(plush), 1);
      }

      function restock() {
        while (plushies.length) removePlush(plushies[0]);
        const stock = TIERS.flatMap((t) => Array(t.count).fill(t));
        const cells = [];
        for (const cx of [-2.7, -0.9, 0.9, 2.7]) {
          for (const cz of [-2.7, -0.9, 0.9, 2.7]) {
            if (cx < -CHUTE.edge && cz > CHUTE.edge) continue;
            cells.push([cx, cz]);
          }
        }
        // Deal animals from a shuffled bag so every kind shows up before any repeats.
        const bag = [];
        const nextAnimal = () => {
          if (!bag.length)
            bag.push(...[...ANIMALS].sort(() => Math.random() - 0.5));
          return bag.pop();
        };
        // Stack the stock in layers so a full machine reads as a pile, not a grid.
        const j = () => (Math.random() - 0.5) * 0.6;
        stock.sort(() => Math.random() - 0.5);
        stock.forEach((tier, i) => {
          const layer = Math.floor(i / cells.length);
          if (i % cells.length === 0) cells.sort(() => Math.random() - 0.5);
          const [cx, cz] = cells[i % cells.length];
          addPlush(
            tier,
            nextAnimal(),
            cx + j(),
            1.0 + layer * 1.5 + Math.random() * 0.5,
            cz + j(),
          );
        });
      }

      // ---------- high scores ----------

      const SCORE_KEY = "startclaw.highscores.v1";
      const BOARD_SIZE = 5;
      function loadScores() {
        try {
          const list = JSON.parse(localStorage.getItem(SCORE_KEY));
          if (!Array.isArray(list)) return [];
          return list
            .filter(
              (s) =>
                typeof s?.score === "number" && typeof s?.name === "string",
            )
            .sort((a, b) => b.score - a.score)
            .slice(0, BOARD_SIZE);
        } catch {
          return [];
        }
      }
      function saveScore(name, score) {
        const entry = { name, score, date: Date.now() };
        const list = [...loadScores(), entry]
          .sort((a, b) => b.score - a.score)
          .slice(0, BOARD_SIZE);
        try {
          localStorage.setItem(SCORE_KEY, JSON.stringify(list));
        } catch {}
        return entry;
      }
      // Global board: one public table on Supabase. Anyone can read it and add a score, nothing else.
      // The publishable key is meant to ship in the page; row-level security does the gatekeeping.
      const WORLD = {
        url: "https://rmswzajiqycfvlgrsqbm.supabase.co/rest/v1/star_claw_scores",
        key: "sb_publishable_QX8Ah8CUiAnjHgUtpf74gg_HnIAKX8E",
        size: 10,
      };
      const globalBoard = { rows: null, failed: false, mine: null };
      const worldHeaders = {
        apikey: WORLD.key,
        Authorization: `Bearer ${WORLD.key}`,
      };
      const cleanName = (s) =>
        s
          .toUpperCase()
          .replace(/[^A-Z0-9 ._!?-]/g, "")
          .trim()
          .slice(0, 10);
      async function fetchWorld() {
        try {
          const res = await fetch(
            `${WORLD.url}?select=id,name,score&order=score.desc,created_at.asc&limit=${WORLD.size}`,
            { headers: worldHeaders },
          );
          if (!res.ok) throw new Error(res.status);
          globalBoard.rows = await res.json();
          globalBoard.failed = false;
        } catch {
          globalBoard.failed = !globalBoard.rows;
        }
        refreshWorldBoard();
      }
      async function postWorld(name, score) {
        try {
          const res = await fetch(WORLD.url, {
            method: "POST",
            headers: {
              ...worldHeaders,
              "Content-Type": "application/json",
              Prefer: "return=representation",
            },
            body: JSON.stringify({ name, score }),
          });
          if (!res.ok) throw new Error(res.status);
          globalBoard.mine = (await res.json())[0]?.id ?? null;
        } catch {}
        await fetchWorld();
      }
      function makesWorld(score) {
        const rows = globalBoard.rows;
        return (
          !!rows &&
          score > 0 &&
          (rows.length < WORLD.size || score > rows[rows.length - 1].score)
        );
      }

      function makesBoard(score) {
        const list = loadScores();
        return (
          score > 0 &&
          (list.length < BOARD_SIZE || score > list[list.length - 1].score)
        );
      }

      // ---------- input ----------

      const keys = {};
      const pressed = {};
      const GAME_KEYS = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Space",
      ];
      addEventListener("keydown", (e) => {
        if (e.target instanceof HTMLInputElement) return;
        if (GAME_KEYS.includes(e.code)) e.preventDefault();
        if (!howtoEl.hidden) {
          if (["Escape", "Enter", "Space", "KeyH"].includes(e.code))
            closeHelp();
          return;
        }
        if (e.code === "KeyH" && !e.repeat) return openHelp();
        if ((e.code === "KeyM" || e.code === "KeyS") && !e.repeat)
          return toggleSound(e.code === "KeyM" ? "music" : "sfx");
        if (game.paused) {
          if (e.code === "Enter" || e.code === "KeyY") answerConfirm(true);
          else if (e.code === "Escape" || e.code === "KeyN")
            answerConfirm(false);
          return;
        }
        if (game.mode !== "play") {
          const ready =
            (game.mode === "title" || game.mode === "over") &&
            performance.now() - game.modeAt > 1200;
          if (ready && !e.repeat && (e.code === "Space" || e.code === "Enter"))
            startGame();
          return;
        }
        if (!e.repeat) pressed[e.code] = true;
        keys[e.code] = true;
        if (e.code === "KeyQ" && !e.repeat) askConfirm("quit");
      });
      addEventListener("keyup", (e) => (keys[e.code] = false));

      // Touch and mouse: drag to move the claw, tap to drop, hold anywhere to reel.
      const TOUCH = matchMedia("(pointer: coarse)").matches;
      const TAP = { maxMove: 10, maxMs: 350 };
      const SIN_ELEV = CAM_OFFSET.y / CAM_OFFSET.length();
      let drag = null;
      let dragTarget = null;

      // Converts a screen-space drag (CSS px) into a move on the floor plane.
      function screenDeltaToGround(dx, dy) {
        const s = (camera.right - camera.left) / innerWidth;
        const right = dx * s; // along (1, 0, -1)
        const toward = (dy * s) / SIN_ELEV; // along (1, 0, 1)
        return {
          x: (right + toward) / Math.SQRT2,
          z: (toward - right) / Math.SQRT2,
        };
      }

      const isUi = (t) =>
        t instanceof Element && t.closest("button, input, .overlay");

      addEventListener("pointerdown", (e) => {
        if (drag || isUi(e.target) || game.mode !== "play" || game.paused)
          return;
        e.preventDefault();
        drag = {
          id: e.pointerId,
          x: e.clientX,
          y: e.clientY,
          t: performance.now(),
          hubX: hub.position.x,
          hubZ: hub.position.z,
          moved: false,
        };
        if (game.state !== "aim") keys.Space = true;
      });
      addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        if (Math.hypot(dx, dy) > TAP.maxMove) drag.moved = true;
        if (game.state === "aim" && drag.moved) {
          const d = screenDeltaToGround(dx, dy);
          const clamp = (n) => Math.max(-CLAW.reach, Math.min(CLAW.reach, n));
          dragTarget = { x: clamp(drag.hubX + d.x), z: clamp(drag.hubZ + d.z) };
        }
      });
      function endDrag(e) {
        if (!drag || e.pointerId !== drag.id) return;
        const tap = !drag.moved && performance.now() - drag.t < TAP.maxMs;
        if (tap && game.state === "aim") pressed.Space = true;
        keys.Space = false;
        drag = null;
        dragTarget = null;
      }
      addEventListener("pointerup", endDrag);
      addEventListener("pointercancel", endDrag);

      // iOS Safari ignores user-scalable=no, so quick taps double-tap-zoom and two fingers pinch.
      // Cancelling the touch events stops that; pointer events still fire. Buttons and inputs keep working.
      const blockZoom = (e) => {
        if (!(e.target instanceof Element)) return e.preventDefault();
        if (e.target.closest("button, input")) return;
        const oneFinger = e.touches && e.touches.length < 2;
        if (e.type !== "touchend" && oneFinger && e.target.closest(".panel"))
          return;
        e.preventDefault();
      };
      for (const type of ["touchstart", "touchmove", "touchend"]) {
        document.addEventListener(type, blockZoom, { passive: false });
      }
      for (const type of ["gesturestart", "gesturechange", "dblclick"]) {
        document.addEventListener(type, (e) => e.preventDefault());
      }

      // ---------- HUD ----------

      const scoreEl = document.getElementById("score");
      const heartsEl = document.getElementById("hearts");
      const bestEl = document.getElementById("best");
      const leftEl = document.getElementById("left");
      const streakEl = document.getElementById("streak");
      const popupsEl = document.getElementById("popups");
      const overlayEl = document.getElementById("overlay");
      const panelEl = document.getElementById("panel");
      const confirmEl = document.getElementById("confirm");

      const fmt = (n) => Math.round(n).toLocaleString("en-US");
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const HEART_RECTS = [
        ".XX.XX.",
        "XXXXXXX",
        "XXXXXXX",
        ".XXXXX.",
        "..XXX..",
        "...X...",
      ]
        .flatMap((row, y) =>
          [...row].map((c, x) =>
            c === "X"
              ? `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`
              : "",
          ),
        )
        .join("");
      const heartSvg = (cls = "") =>
        `<svg class="${cls}" viewBox="0 0 7 6" shape-rendering="crispEdges">${HEART_RECTS}</svg>`;

      function renderHearts() {
        heartsEl.innerHTML = Array.from({ length: RULES.lives }, (_, i) => {
          const f = Math.max(0, Math.min(1, game.lives - i));
          return `<span class="heart">${heartSvg("empty")}<span class="fill" style="width:${f * 100}%">${heartSvg()}</span></span>`;
        }).join("");
      }

      const streakMult = () =>
        Math.min(RULES.streakMax, 1 + RULES.streakStep * game.streak);

      function renderHud() {
        renderHearts();
        const best = Math.max(loadScores()[0]?.score ?? 0, game.score);
        bestEl.textContent = `BEST ${fmt(best)}`;
        leftEl.textContent = `${plushies.length} LEFT`;
        streakEl.textContent =
          game.streak > 0 ? `NEXT CATCH x${streakMult()}` : "";
      }

      function popup(main, detail, color, big = false) {
        const el = document.createElement("div");
        el.className = big ? "popup big" : "popup";
        el.style.color = color;
        el.innerHTML = `<b>${main}</b>${detail ? `<small>${detail}</small>` : ""}`;
        popupsEl.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      }

      // The score counts up toward the real value instead of jumping.
      let shownScore = 0;
      function tallyScore(dt) {
        if (shownScore === game.score) return;
        const step = Math.max(
          1,
          (game.score - shownScore) * Math.min(1, dt * 5),
        );
        shownScore =
          game.score < shownScore
            ? game.score
            : Math.min(game.score, shownScore + step);
        scoreEl.textContent = fmt(shownScore);
      }
      function bumpScore() {
        scoreEl.classList.add("bump");
        requestAnimationFrame(() =>
          requestAnimationFrame(() => scoreEl.classList.remove("bump")),
        );
      }

      // ---------- confetti ----------

      const fxCanvas = document.getElementById("fx");
      const fx = fxCanvas.getContext("2d");
      const confetti = [];
      const CONFETTI_COLORS = [
        ...TIERS.map((t) => t.css),
        "#ffd75e",
        "#fff4dc",
      ];
      function sizeFx() {
        const d = Math.min(devicePixelRatio, 2);
        fxCanvas.width = innerWidth * d;
        fxCanvas.height = innerHeight * d;
        fx.setTransform(d, 0, 0, d, 0, 0);
      }
      const piece = (x, y, vx, vy, life) => ({
        x,
        y,
        vx,
        vy,
        life,
        rot: Math.random() * 6.28,
        spin: (Math.random() - 0.5) * 12,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        color: pick(CONFETTI_COLORS),
      });
      function burst(x, y, n, power = 1) {
        for (let i = 0; i < n; i++) {
          const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
          const s = (200 + Math.random() * 380) * power;
          confetti.push(
            piece(x, y, Math.cos(a) * s, Math.sin(a) * s, 3 + Math.random()),
          );
        }
      }
      function rain(n) {
        for (let i = 0; i < n; i++) {
          const p = piece(
            Math.random() * innerWidth,
            -20 - Math.random() * innerHeight * 1.5,
            (Math.random() - 0.5) * 80,
            80 + Math.random() * 80,
            9,
          );
          confetti.push(p);
        }
      }
      let fxDirty = false;
      function stepFx(dt) {
        if (!confetti.length && !fxDirty) return;
        fx.clearRect(0, 0, innerWidth, innerHeight);
        fxDirty = confetti.length > 0;
        const drag = Math.pow(0.35, dt);
        for (let i = confetti.length - 1; i >= 0; i--) {
          const p = confetti[i];
          p.life -= dt;
          p.vx *= drag;
          p.vy = p.vy * drag + 500 * dt;
          p.x += p.vx * dt + Math.sin(p.rot) * 20 * dt;
          p.y += p.vy * dt;
          p.rot += p.spin * dt;
          if (p.life <= 0 || p.y > innerHeight + 30) {
            confetti.splice(i, 1);
            continue;
          }
          fx.save();
          fx.globalAlpha = Math.min(1, p.life);
          fx.translate(p.x, p.y);
          fx.rotate(p.rot);
          fx.fillStyle = p.color;
          fx.fillRect(
            -p.w / 2,
            (-p.h / 2) * Math.cos(p.rot * 2),
            p.w,
            p.h * Math.cos(p.rot * 2),
          );
          fx.restore();
        }
      }
      function popupPoint() {
        const r = popupsEl.getBoundingClientRect();
        return [r.left, r.top + 20];
      }

      // ---------- overlays ----------

      function setMode(mode) {
        game.mode = mode;
        game.modeAt = performance.now();
        document.body.dataset.mode = mode;
      }

      const tiersHtml = () =>
        `<div class="tiers">${TIERS.map(
          (t) =>
            `<div><i class="dot" style="background:${t.css}"></i>${t.name.toUpperCase()}<b>${t.points}</b></div>`,
        ).join("")}</div><p>Easy &rarr; hard. Cherry is the tough one.</p>`;

      function listHtml(rows, size, pending, isMine) {
        rows = [...rows];
        if (pending) rows.push({ name: "???", score: pending, you: true });
        rows.sort((a, b) => b.score - a.score);
        if (!rows.length)
          return `<p class="empty">No scores yet. Be the first!</p>`;
        return `<ol class="board">${rows
          .slice(0, size)
          .map(
            (r, i) =>
              `<li class="${r.you || isMine(r) ? "you" : ""}"><span>${i + 1}.</span><span>${esc(r.name)}</span><span>${fmt(r.score)}</span></li>`,
          )
          .join("")}</ol>`;
      }
      const boardHtml = (pending, highlight) =>
        listHtml(
          loadScores(),
          BOARD_SIZE,
          pending,
          (r) => r.date === highlight,
        );
      let worldPending = 0;
      function worldHtml() {
        if (globalBoard.rows)
          return listHtml(
            globalBoard.rows,
            WORLD.size,
            worldPending,
            (r) => r.id === globalBoard.mine,
          );
        return `<p class="empty">${globalBoard.failed ? "World board is offline." : "Loading..."}</p>`;
      }
      function refreshWorldBoard() {
        const el = document.getElementById("world-board");
        if (el) el.innerHTML = worldHtml();
      }
      // Local top 5 and world top 10, side by side when there is room.
      function boardsHtml(title, pending, highlight) {
        worldPending = pending && makesWorld(pending) ? pending : 0;
        return `<div class="boards">
          <div><h2>${title}</h2>${boardHtml(pending && makesBoard(pending) ? pending : 0, highlight)}</div>
          <div><h2>WORLD TOP ${WORLD.size}</h2><div id="world-board">${worldHtml()}</div></div>
        </div>`;
      }

      function showPanel(html) {
        panelEl.innerHTML = html;
        overlayEl.hidden = false;
        panelEl.scrollTop = 0;
      }

      function renderTitle() {
        showPanel(`
          <h1>STAR CLAW</h1>
          <p>Grab plushies, win the reel, drop them in the chute.</p>
          ${tiersHtml()}
          ${collectionHtml()}
          ${boardsHtml("YOUR TOP 5")}
          <div class="actions">
            <button class="btn big" type="button" data-action="play">${TOUCH ? "TAP TO PLAY" : "PLAY (SPACE)"}</button>
          </div>`);
      }

      // ---------- how to play ----------

      // One help sheet, opened by the ? button, H, or automatically the first time this browser plays.
      const HOWTO_KEY = "startclaw.howto.v1";
      const howtoEl = document.getElementById("howto");
      const howtoPanel = document.getElementById("howto-panel");
      let howtoPaused = false;

      // The three moves of a turn, as cards with a little pixel gesture each.
      const GESTURES = {
        drag: `<svg viewBox="0 0 24 24" shape-rendering="crispEdges"><path d="M10 9h4v4h-4z" fill="#fff4e2"/><path d="M11 2h2v5h-2zM11 15h2v5h-2zM3 10h5v2H3zM16 10h5v2h-5zM10 4h1v1h-1zM13 4h1v1h-1zM10 17h1v1h-1zM13 17h1v1h-1zM5 9h1v1H5zM5 12h1v1H5zM18 9h1v1h-1zM18 12h1v1h-1z" fill="#ffd75e"/></svg>`,
        tap: `<svg viewBox="0 0 24 24" shape-rendering="crispEdges"><path d="M10 10h4v4h-4z" fill="#fff4e2"/><path d="M8 6h8v1H8zM8 17h8v1H8zM6 8h1v8H6zM17 8h1v8h-1zM7 7h1v1H7zM16 7h1v1h-1zM7 16h1v1H7zM16 16h1v1h-1z" fill="#ffd75e"/></svg>`,
        hold: `<svg viewBox="0 0 24 24" shape-rendering="crispEdges"><path d="M9 9h6v6H9z" fill="#fff4e2"/><path d="M7 4h10v1H7zM7 19h10v1H7zM4 7h1v10H4zM19 7h1v10h-1zM5 5h2v2H5zM17 5h2v2h-2zM5 17h2v2H5zM17 17h2v2h-2z" fill="#5ee05e"/></svg>`,
      };
      function stepsHtml() {
        const steps = TOUCH
          ? [
              ["drag", "DRAG", "to move"],
              ["tap", "TAP", "to drop"],
              ["hold", "HOLD", "to reel"],
            ]
          : [
              ["drag", "ARROWS", "to move"],
              ["tap", "SPACE", "to drop"],
              ["hold", "HOLD SPACE", "to reel"],
            ];
        return `<div class="steps">${steps
          .map(
            ([icon, key, text], n) =>
              `<div class="step"><span class="n">${n + 1}</span>${GESTURES[icon]}<b>${key}</b><span>${text}</span></div>`,
          )
          .join("")}</div>`;
      }
      function openHelp() {
        if (!howtoEl.hidden || pendingConfirm) return;
        const heart = heartSvg("inline");
        // Kept short enough to fit a phone screen without scrolling; GOT IT also sticks to the bottom.
        const tiers = TIERS.map(
          (t) =>
            `<div><i class="dot" style="background:${t.css}"></i>${t.name.toUpperCase()}<b>${t.points}</b></div>`,
        ).join("");
        howtoPanel.innerHTML = `
          <h1>HOW TO PLAY</h1>
          <p>Drop the claw on a plushie, then keep it in the green bar to reel it into the chute.</p>
          ${stepsHtml()}
          <p class="aside">${TOUCH ? "QUIT &amp; SAVE cashes out &middot; &#9835; / &#128264; toggle sound" : "Q cashes out &middot; M / S toggle sound &middot; H opens this"}</p>
          <h2>POINTS</h2>
          <div class="tiers">${tiers}</div>
          <p>Perfect reel x1.5 &middot; streaks up to x${RULES.streakMax}</p>
          <h2>HEARTS</h2>
          <p>Miss or drop -&frac12;${heart} &middot; lost reel -1${heart} &middot; catch +&frac12;${heart}<br />Cash out +${RULES.cashOutPerHalf} per &frac12;${heart} &middot; clear it all +${RULES.clearBonus}</p>
          <p>Collect all ${COLLECTION_SIZE} and top the world board.</p>
          <div class="actions"><button class="btn big" type="button" data-close-help>GOT IT</button></div>`;
        howtoEl.hidden = false;
        howtoPanel.scrollTop = 0;
        sfx.blip();
        if (game.mode === "play" && !game.paused) {
          game.paused = true;
          howtoPaused = true;
          keys.Space = false;
        }
      }
      function closeHelp() {
        if (howtoEl.hidden) return;
        howtoEl.hidden = true;
        if (howtoPaused) game.paused = false;
        howtoPaused = false;
        try {
          localStorage.setItem(HOWTO_KEY, "1");
        } catch {}
      }
      addEventListener("click", (e) => {
        if (!(e.target instanceof Element)) return;
        if (e.target.closest("[data-help]")) openHelp();
        else if (e.target.closest("[data-close-help]") || e.target === howtoEl)
          closeHelp();
      });

      function renderOver() {
        const r = game.result;
        const entering = r.highscore && !r.saved;
        const head = r.cleared
          ? `<h1 class="win">MACHINE CLEARED!</h1><p>Every plushie found a home. Clear bonus +${fmt(r.bonus)}</p>`
          : r.quit
            ? r.highscore
              ? `<h1 class="win">CASHED OUT!</h1><p class="hey">and it's a highscore</p><p>Hearts bonus +${fmt(r.bonus)}</p>`
              : `<h1 class="win">CASHED OUT</h1><p>Hearts bonus +${fmt(r.bonus)}. Not quite enough for the list this time.</p>`
            : r.highscore
              ? `<h1 class="lost">YOU LOST THE GAME,</h1><p class="hey">but hey this is a highscore</p>`
              : `<h1 class="lost">YOU LOST THE GAME</h1>`;
        const form = entering
          ? `<form class="name"><label for="name">PUT YOUR NAME ON THE LIST</label><div class="row"><input id="name" name="name" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NAME" /><button class="btn" type="submit">SAVE</button></div></form>`
          : "";
        showPanel(`
          ${head}
          <div class="final">SCORE<b>${fmt(r.score)}</b></div>
          <h2>YOUR HAUL</h2>
          ${game.bag.length ? `<div class="haul">${game.bag.map(prizeImg).join("")}</div>` : `<p class="empty">The bag stayed empty this time.</p>`}
          ${collectionHtml()}
          ${r.top && !r.saved ? `<p class="hey">NEW #1 HIGH SCORE!</p>` : ""}
          ${form}
          ${boardsHtml(entering ? "PREVIOUS WINNERS" : "YOUR TOP 5", entering ? r.score : 0, r.savedDate)}
          <div class="actions"><button class="btn big" type="button" data-action="play">${TOUCH ? "PLAY AGAIN" : "PLAY AGAIN (SPACE)"}</button></div>`);
        if (entering && !TOUCH) panelEl.querySelector("input").focus();
      }

      function submitName(fallback) {
        const r = game.result;
        if (!r?.highscore || r.saved) return;
        const input = panelEl.querySelector("input");
        const typed = cleanName(input?.value ?? "");
        const name = typed || fallback || "";
        if (!name) return input?.focus();
        if (makesBoard(r.score)) r.savedDate = saveScore(name, r.score).date;
        // Only names people actually typed go to the world board, not the PLAYER fallback.
        if (typed && makesWorld(r.score)) postWorld(name, r.score);
        if (typed) sfx.saved();
        r.saved = true;
      }

      panelEl.addEventListener("submit", (e) => {
        e.preventDefault();
        submitName();
        renderOver();
        renderHud();
      });
      panelEl.addEventListener("click", (e) => {
        if (e.target.closest("[data-action=play]")) startGame();
      });

      const CONFIRMS = {
        quit: {
          title: "CASH OUT?",
          text: () =>
            `End the run now and keep your ${fmt(game.score)} points, plus ${fmt(cashOutBonus())} for the hearts you have left.`,
          yes: "CASH OUT",
          run: () => gameOver("quit", cashOutBonus()),
        },
      };
      let pendingConfirm = null;
      function askConfirm(kind) {
        if (game.mode !== "play" || game.paused) return;
        const c = CONFIRMS[kind];
        pendingConfirm = c;
        game.paused = true;
        keys.Space = false;
        document.getElementById("confirm-title").textContent = c.title;
        document.getElementById("confirm-text").textContent = c.text();
        document.getElementById("confirm-yes").textContent = c.yes;
        confirmEl.hidden = false;
        sfx.blip();
        document.getElementById("confirm-no").focus();
      }
      function answerConfirm(yes) {
        const c = pendingConfirm;
        pendingConfirm = null;
        game.paused = false;
        confirmEl.hidden = true;
        document.activeElement?.blur?.();
        if (yes) c?.run();
      }
      document
        .getElementById("quit")
        .addEventListener("click", () => askConfirm("quit"));
      document
        .getElementById("confirm-yes")
        .addEventListener("click", () => answerConfirm(true));
      document
        .getElementById("confirm-no")
        .addEventListener("click", () => answerConfirm(false));

      // ---------- game state ----------

      const game = {
        mode: "title",
        modeAt: 0,
        paused: false,
        state: "settle",
        t: 0,
        held: null,
        mg: null,
        score: 0,
        lives: RULES.lives,
        streak: 0,
        turn: null,
        result: null,
        bag: [],
      };

      const STATE_SFX = {
        drop: () => sfx.drop(),
        close: () => sfx.clack(),
        lift: () => sfx.lift(),
        release: () => sfx.release(),
      };
      function setState(state) {
        if (state !== game.state) STATE_SFX[state]?.();
        game.state = state;
        game.t = 0;
      }

      function startGame() {
        // Leaving the end screen without typing a name still keeps the score.
        if (game.result) submitName("PLAYER");
        fetchWorld();
        sfx.coinIn();
        setMusicLevel(1);
        showReel(false);
        overlayEl.hidden = true;
        setMode("play");
        Object.assign(game, {
          score: 0,
          lives: RULES.lives,
          streak: 0,
          held: null,
          mg: null,
          turn: null,
          result: null,
          bag: [],
        });
        renderBag();
        shownScore = 0;
        scoreEl.textContent = "0";
        claw.closing = false;
        drawMarquee("STAR CLAW");
        restock();
        setState("home");
        renderHud();
      }

      // ---------- prize bag & collection ----------

      const iconUrls = {};
      function plushIconUrl(tier, animal) {
        const id = `${tier.name}:${animal.name}`;
        if (iconUrls[id]) return iconUrls[id];
        const cv = document.createElement("canvas");
        cv.width = cv.height = 64;
        drawPlushIcon(cv.getContext("2d"), animal.icon, tier.css, 32, 36, 18);
        return (iconUrls[id] = cv.toDataURL());
      }
      const prizeImg = (p) =>
        `<img class="prize-icon${p.fresh ? " fresh" : ""}" src="${plushIconUrl(p.tier, p.animal)}" alt="${p.tier.name} ${p.animal.name}" title="${p.tier.name} ${p.animal.name}${p.fresh ? " (new!)" : ""}" />`;

      // Every colour + animal combo you have ever won, across runs.
      const COLLECTION_KEY = "startclaw.collection.v1";
      const COLLECTION_SIZE = TIERS.length * ANIMALS.length;
      let collection;
      try {
        collection = new Set(
          JSON.parse(localStorage.getItem(COLLECTION_KEY)) ?? [],
        );
      } catch {
        collection = new Set();
      }
      function collect(plush) {
        const id = `${plush.tier.name}:${plush.animal.name}`;
        if (collection.has(id)) return false;
        collection.add(id);
        try {
          localStorage.setItem(COLLECTION_KEY, JSON.stringify([...collection]));
        } catch {}
        return true;
      }
      const collectionHtml = () =>
        `<p class="collection">COLLECTION ${collection.size}/${COLLECTION_SIZE}</p>`;

      const bagEl = document.getElementById("bag");
      const bagItemsEl = document.getElementById("bag-items");
      const bagCountEl = document.getElementById("bag-count");
      function renderBag() {
        bagItemsEl.innerHTML = game.bag.map(prizeImg).join("");
        bagCountEl.textContent = game.bag.length ? `x${game.bag.length}` : "";
      }

      // The won plushie pops out of the chute and arcs into the bag.
      function flyToBag(plush, prize) {
        const v = new THREE.Vector3(CHUTE.x, 0.5, CHUTE.z).project(camera);
        const x0 = ((v.x + 1) / 2) * innerWidth;
        const y0 = ((1 - v.y) / 2) * innerHeight;
        bagItemsEl.insertAdjacentHTML("beforeend", prizeImg(prize));
        const slot = bagItemsEl.lastElementChild;
        slot.style.visibility = "hidden";
        bagCountEl.textContent = `x${game.bag.length}`;
        const r = slot.getBoundingClientRect();
        const x1 = r.left + r.width / 2;
        const y1 = r.top + r.height / 2;
        const fly = document.createElement("img");
        fly.className = "prize-flyer";
        fly.src = slot.src;
        document.body.appendChild(fly);
        const k = r.width / 44;
        const peak = Math.min(y0, y1) - 120;
        fly
          .animate(
            [
              { transform: `translate(${x0}px, ${y0}px) scale(0.4)` },
              {
                transform: `translate(${(x0 + x1) / 2}px, ${peak}px) scale(1.5) rotate(-12deg)`,
                offset: 0.45,
              },
              {
                transform: `translate(${x1}px, ${y1}px) scale(${k}) rotate(0deg)`,
              },
            ],
            { duration: 900, easing: "cubic-bezier(.3,.7,.4,1)" },
          )
          .finished.then(() => {
            fly.remove();
            slot.style.visibility = "";
            sfx.plop();
            bagEl.classList.remove("bump");
            void bagEl.offsetWidth;
            bagEl.classList.add("bump");
          });
      }

      function awardPrize(plush) {
        if (game.mode !== "play") return;
        const perfect =
          plush === game.held &&
          game.mg?.result === "caught" &&
          game.mg.perfect;
        const mult = streakMult();
        const pts = Math.round(
          plush.tier.points * (perfect ? 1 + RULES.perfectBonus : 1) * mult,
        );
        game.score += pts;
        game.streak++;
        // The first prize of a grab heals half a heart, up to the full five.
        let healed = false;
        if (game.turn && game.turn.prizes++ === 0 && game.lives < RULES.lives) {
          game.lives = Math.min(RULES.lives, game.lives + RULES.catchHeal);
          healed = true;
          flashHearts("heal");
        }
        const tags = [
          `${plush.tier.name} ${plush.animal.name}`.toUpperCase(),
          perfect && "PERFECT x1.5",
          mult > 1 && `STREAK x${mult}`,
          healed && `+&frac12; ${heartSvg("inline")}`,
        ].filter(Boolean);
        const prize = {
          tier: plush.tier,
          animal: plush.animal,
          fresh: collect(plush),
        };
        if (prize.fresh) tags.push("NEW!");
        game.bag.push(prize);
        flyToBag(plush, prize);
        sfx.prize(TIERS.indexOf(plush.tier), game.streak - 1);
        if (prize.fresh) sfx.fresh();
        if (healed) sfx.heal();
        popup(`+${fmt(pts)}`, tags.join(" · "), plush.tier.css);
        const [px, py] = popupPoint();
        burst(px, py, 10 + TIERS.indexOf(plush.tier) * 8, 0.8);
        bumpScore();
        renderHud();
      }

      function loseLife(cost, why) {
        game.lives = Math.max(0, game.lives - cost);
        game.streak = 0;
        popup(
          `-${cost === 0.5 ? "&frac12;" : cost} ${heartSvg("inline")}`,
          why,
          "#f7a8b8",
        );
        flashHearts("hurt");
        sfx.hurt(cost >= 1);
        renderHud();
      }

      function flashHearts(kind) {
        heartsEl.classList.remove("hurt", "heal");
        void heartsEl.offsetWidth;
        heartsEl.classList.add(kind);
      }

      // Cashing out pays for the hearts you didn't spend.
      const cashOutBonus = () =>
        Math.round(game.lives / 0.5) * RULES.cashOutPerHalf;

      function endTurn() {
        const turn = game.turn;
        game.held = null;
        game.mg = null;
        game.turn = null;
        if (turn && turn.prizes === 0) {
          if (turn.kind === "miss") loseLife(RULES.missCost, "MISSED THE GRAB");
          else if (turn.result === "escaped")
            loseLife(RULES.failCost, "IT GOT AWAY");
          else loseLife(RULES.dropCost, "DROPPED IT");
        }
        if (!plushies.length) return clearMachine();
        if (game.lives <= 0) return gameOver("lost");
        setState("aim");
      }

      function clearMachine() {
        const bonus = RULES.clearBonus + RULES.heartBonus * game.lives;
        game.score += bonus;
        setMode("clear");
        setState("idle");
        drawMarquee("CLEARED!");
        popup("CLEARED!", `BONUS +${fmt(bonus)}`, "#ffd75e", true);
        bumpScore();
        const [px, py] = popupPoint();
        burst(px, py, 120, 1.3);
        setTimeout(
          () => burst(innerWidth * 0.2, innerHeight * 0.6, 80, 1.4),
          500,
        );
        setTimeout(
          () => burst(innerWidth * 0.8, innerHeight * 0.6, 80, 1.4),
          900,
        );
        rain(260);
        sfx.cleared();
        setTimeout(() => gameOver("cleared", bonus), 3600);
      }

      // How a run ends: "lost" (out of hearts), "cleared" (machine empty) or "quit" (cashed out).
      function gameOver(end, bonus = 0) {
        const cleared = end === "cleared";
        setMode("over");
        if (end === "lost") setState("idle");
        if (end === "quit") {
          // Whatever is in the claw is forfeit; open up and park over the chute.
          game.held = null;
          game.mg = null;
          game.turn = null;
          showReel(false);
          setState("home");
          game.score += bonus;
          if (bonus)
            popup("CASHED OUT", `HEARTS +${fmt(bonus)}`, "#ffd75e", true);
          bumpScore();
        }
        game.result = {
          cleared,
          quit: end === "quit",
          bonus,
          score: game.score,
          highscore: makesBoard(game.score) || makesWorld(game.score),
          top: game.score > (loadScores()[0]?.score ?? 0),
          saved: false,
        };
        if (game.result.highscore) rain(cleared ? 160 : 90);
        setMusicLevel(0.4);
        if (!cleared)
          (game.result.highscore
            ? sfx.fanfare
            : end === "quit"
              ? sfx.cashOut
              : sfx.lost)();
        renderOver();
        renderHud();
      }

      const horizDist = (b) =>
        Math.hypot(
          b.position.x - hub.position.x,
          b.position.z - hub.position.z,
        );
      const isHeld = (plush) =>
        plushies.includes(plush) &&
        plush.body.position.y > 2.6 &&
        horizDist(plush.body) < 1.4;

      function findHeldPlush() {
        let best = null;
        for (const b of plushies) {
          if (isHeld(b) && (!best || b.body.position.y > best.body.position.y))
            best = b;
        }
        return best;
      }

      // The real cabinet stops the drop when the cable goes slack. Here: the hub lands on a prize,
      // a prong hits the floor, or a prong is splayed open by what it landed on.
      function dropBlocked() {
        if (hub.position.y <= CLAW.minY) return true;
        for (const c of world.contacts) {
          const pair = [c.bi, c.bj];
          if (pair.includes(hub)) {
            const other = pair.find((b) => b !== hub);
            if (other.position.y < hub.position.y - 0.1) return true;
          }
          const prong = pair.find((b) => prongBodies.has(b));
          // Only the floor and the chute guard count. Near the glass the open prongs graze the walls,
          // which used to stop the drop at the very top once the last plushies had drifted to the edges.
          const ground = pair.find(
            (b) => b.type === CANNON.Body.STATIC && b.position.y < 1,
          );
          if (prong && ground) return true;
        }
        return prongs.some((p) => p.angle > CLAW.openAngle + 0.25);
      }

      // Opening the prongs isn't always enough: a plushie wedged between them used to ride along forever,
      // trip dropBlocked() on every later drop and turn each grab into a short one. On release, anything
      // still in the claw stops colliding with it until it has fallen clear.
      function letGo() {
        for (const b of plushies) {
          if (horizDist(b.body) < 1.5 && b.body.position.y > 1.5) {
            b.body.collisionFilterMask = G_STATIC | G_PRIZE;
            b.ghost = true;
          }
        }
      }
      function restoreGhosts() {
        for (const b of plushies) {
          if (
            b.ghost &&
            (b.body.position.y < hub.position.y - 2.4 ||
              horizDist(b.body) > 1.8)
          ) {
            b.body.collisionFilterMask = PRIZE_MASK;
            b.ghost = false;
          }
        }
      }

      function steerTo(v, tx, tz, speed, dt) {
        const dx = tx - hub.position.x;
        const dz = tz - hub.position.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.01) return true;
        const s = Math.min(speed, d / dt);
        v.x = (dx / d) * s;
        v.z = (dz / d) * s;
        return false;
      }

      // Keep the reel up a beat after it ends so the result registers, then tuck it away.
      let reelHide = 0;
      function showReel(on) {
        clearTimeout(reelHide);
        if (on) document.body.classList.add("reeling");
        else
          reelHide = setTimeout(
            () => document.body.classList.remove("reeling"),
            700,
          );
      }

      function startReel(plush) {
        showReel(true);
        sfx.reelStart();
        setMusicLevel(0.45);
        const t = plush.tier;
        game.held = plush;
        game.turn.kind = "reel";
        game.mg = {
          tier: t,
          animal: plush.animal,
          barPos: 0,
          barVel: 0,
          fishPos: t.barHeight / 2,
          fishVel: 0,
          fishTarget: 0.5,
          behavior: t.behaviors[0],
          progress: MG.startProgress,
          t: 0,
          perfect: true,
          result: null,
        };
        setState("reel");
      }

      function endReel(result) {
        if (result === "caught") sfx.caught(game.mg.perfect);
        else if (result === "escaped") sfx.escaped();
        else sfx.slipped();
        setMusicLevel(1);
        showReel(false);
        game.mg.result = result;
        game.turn.result = result;
        if (result === "caught") claw.torque = GRIP.max;
        if (result === "escaped") claw.closing = false;
        setState("return");
      }

      function stepFish(mg, dt) {
        const d = mg.tier.difficulty / 100;
        const list = mg.tier.behaviors;
        if (list.length > 1 && Math.random() < dt * 0.5) {
          mg.behavior = list[Math.floor(Math.random() * list.length)];
        }
        const r = Math.random();
        switch (mg.behavior) {
          case "smooth":
            mg.fishTarget = 0.5 + 0.35 * Math.sin(mg.t * (0.8 + d));
            break;
          case "mixed":
            if (r < dt * (1 + 2 * d)) mg.fishTarget = Math.random();
            break;
          case "dart":
            if (r < dt * (1.5 + 3 * d)) mg.fishTarget = Math.random();
            break;
          case "sinker":
            mg.fishTarget = Math.max(0, mg.fishTarget - dt * 0.3);
            if (r < dt * 1.5) mg.fishTarget = Math.min(1, mg.fishPos + 0.3);
            break;
          case "floater":
            mg.fishTarget = Math.min(1, mg.fishTarget + dt * 0.3);
            if (r < dt * 1.5) mg.fishTarget = Math.max(0, mg.fishPos - 0.3);
            break;
        }
        const speed =
          (mg.behavior === "dart" ? 6 + 6 * d : 2.5 + 3 * d) * MG.bearSpeed;
        mg.fishVel += (mg.fishTarget - mg.fishPos) * speed * dt * 6;
        mg.fishVel *= Math.pow(0.02, dt);
        mg.fishPos = Math.min(1, Math.max(0, mg.fishPos + mg.fishVel * dt));
      }

      function stepReel(dt) {
        const mg = game.mg;
        mg.t += dt;
        mg.barVel += (keys.Space ? MG.lift : -MG.gravity) * dt;
        mg.barPos += mg.barVel * dt;
        const top = 1 - mg.tier.barHeight;
        if (mg.barPos < 0) {
          mg.barPos = 0;
          mg.barVel = -mg.barVel * MG.bounce;
        } else if (mg.barPos > top) {
          mg.barPos = top;
          mg.barVel = 0;
        }
        stepFish(mg, dt);
        const inBar =
          mg.fishPos >= mg.barPos &&
          mg.fishPos <= mg.barPos + mg.tier.barHeight;
        mg.progress += (inBar ? MG.fillRate : -MG.drainRate) * dt;
        if (!inBar) mg.perfect = false;
        mg.progress = Math.min(1, Math.max(0, mg.progress));
        // Ping in, buzz out, and a ratchet that clicks up as the grip builds.
        if (mg.wasInBar !== undefined && inBar !== mg.wasInBar)
          inBar ? sfx.inBar() : sfx.outBar();
        mg.wasInBar = inBar;
        const notch = Math.floor(mg.progress * 16);
        if (mg.notch !== undefined && notch > mg.notch)
          sfx.ratchet(mg.progress);
        else if (mg.notch !== undefined && notch < mg.notch)
          sfx.slack(mg.progress);
        mg.notch = notch;
        claw.torque = gripAt(mg.progress);

        if (!isHeld(game.held)) endReel("slipped");
        else if (mg.progress >= 1) endReel("caught");
        else if (mg.progress <= 0) endReel("escaped");
        else if (mg.t >= MG.timeLimit) endReel("timeout");
      }

      function tick(dt) {
        game.t += dt;
        const v = hub.velocity;
        v.set(0, 0, 0);
        switch (game.state) {
          case "home":
            claw.closing = false;
            if (hub.position.y < CLAW.topY - 0.01)
              v.y = Math.min(CLAW.liftSpeed, (CLAW.topY - hub.position.y) / dt);
            else if (steerTo(v, CHUTE.x, CHUTE.z, CLAW.moveSpeed, dt))
              setState("settle");
            break;
          case "settle":
            claw.closing = false;
            if (game.t > 1.5 && game.mode === "play") setState("aim");
            break;
          case "aim": {
            const ix = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
            const iz = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
            const clampAxis = (pos, vel) =>
              Math.max(
                (-CLAW.reach - pos) / dt,
                Math.min((CLAW.reach - pos) / dt, vel),
              );
            if (dragTarget && !ix && !iz) {
              // The claw follows the finger, but at gantry speed so the physics stays sane.
              steerTo(v, dragTarget.x, dragTarget.z, CLAW.moveSpeed * 2, dt);
            } else {
              v.x = clampAxis(hub.position.x, ix * CLAW.moveSpeed);
              v.z = clampAxis(hub.position.z, iz * CLAW.moveSpeed);
            }
            if (pressed.Space) {
              game.turn = { kind: "miss", prizes: 0, result: null };
              setState("drop");
            }
            break;
          }
          case "drop":
            v.y = -Math.min(CLAW.dropSpeed, (hub.position.y - CLAW.minY) / dt);
            if (game.t > 0.1 && dropBlocked()) setState("close");
            break;
          case "close":
            claw.closing = true;
            // Hold tight on the way up; the reel meter only takes over once the plushie is at the top.
            claw.torque = GRIP.max;
            if (game.t > CLAW.closeTime) setState("lift");
            break;
          case "lift":
            v.y = Math.min(CLAW.liftSpeed, (CLAW.topY - hub.position.y) / dt);
            if (hub.position.y >= CLAW.topY - 0.01) setState("top");
            break;
          case "top":
            if (game.t > CLAW.topPause) {
              const plush = findHeldPlush();
              if (plush) startReel(plush);
              else {
                sfx.empty();
                setState("return");
              }
            }
            break;
          case "reel":
            stepReel(dt);
            break;
          case "return":
            if (steerTo(v, CHUTE.x, CHUTE.z, CLAW.moveSpeed * 0.8, dt)) {
              claw.closing = false;
              letGo();
              setState("release");
            }
            break;
          case "release": {
            // Give whatever we let go of time to land before judging the turn.
            const held = game.held;
            const falling =
              held && plushies.includes(held) && held.body.position.y > 0.8;
            if (game.t > CLAW.releaseTime && (!falling || game.t > 3))
              endTurn();
            break;
          }
        }

        restoreGhosts();
        for (const b of [...plushies]) {
          if (b.body.position.y < -1.5) {
            awardPrize(b);
            removePlush(b);
            renderHud();
          }
        }
        for (const k in pressed) delete pressed[k];
      }

      // ---------- carriage screen ----------

      const sctx = screenCanvas.getContext("2d");
      const SW = screenCanvas.width;
      const SH = screenCanvas.height;
      const TRACK = { x: 14, y: 12, w: 110, h: SH - 24 };
      const METER = { x: 136, y: 12, w: 20, h: SH - 24 };
      const IDLE_TEXT = {
        home: ["RESET"],
        settle: ["STOCKING"],
        aim: ["ALIGN", "", TOUCH ? "TAP" : "SPACE", "TO DROP"],
        drop: ["DROP!"],
        close: ["GRAB!"],
        lift: ["UP UP"],
        top: ["..."],
        return: ["MISSED"],
        release: ["OPEN"],
      };
      const MODE_TEXT = {
        title: ["PRESS", "START"],
        clear: ["YOU", "WIN!"],
        over: ["GAME", "OVER"],
      };

      // Pixel-ish portrait of the hooked plushie, drawn in its tier colour.
      function drawPlushIcon(c, icon, color, x, y, s) {
        c.fillStyle = color;
        c.strokeStyle = "#3a2a1a";
        c.lineWidth = Math.max(2, s / 6);
        const blob = (bx, by, rx, ry, rot = 0) => {
          c.beginPath();
          c.ellipse(bx, by, rx, ry, rot, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        };
        if (icon === "bear")
          for (const k of [-1, 1])
            blob(x + k * 0.72 * s, y - 0.72 * s, 0.38 * s, 0.38 * s);
        if (icon === "bunny")
          for (const k of [-1, 1])
            blob(x + k * 0.38 * s, y - 1.2 * s, 0.24 * s, 0.7 * s, k * 0.15);
        if (icon === "frog")
          for (const k of [-1, 1])
            blob(x + k * 0.5 * s, y - 0.75 * s, 0.36 * s, 0.36 * s);
        if (icon === "pig")
          for (const k of [-1, 1])
            blob(x + k * 0.62 * s, y - 0.82 * s, 0.26 * s, 0.32 * s, k * 0.5);
        if (icon === "cat" || icon === "fox")
          for (const k of [-1, 1]) {
            const tall = icon === "fox" ? 1.45 : 1.25;
            c.beginPath();
            c.moveTo(x + k * 0.95 * s, y - 0.25 * s);
            c.lineTo(x + k * 0.8 * s, y - tall * s);
            c.lineTo(x + k * 0.2 * s, y - 0.85 * s);
            c.closePath();
            c.fill();
            c.stroke();
          }
        if (icon === "axolotl")
          for (const k of [-1, 1])
            for (const a of [-0.6, 0, 0.6])
              blob(
                x + k * 1.25 * s,
                y - 0.15 * s + a * 0.6 * s,
                0.32 * s,
                0.14 * s,
                a * k,
              );
        const wide = ["axolotl", "cat", "frog", "fox"].includes(icon);
        blob(x, y, (wide ? 1.15 : 1) * s, (icon === "frog" ? 0.85 : 1) * s);
        if (icon === "penguin") {
          c.fillStyle = "#fff4e2";
          blob(x, y + 0.12 * s, 0.75 * s, 0.7 * s);
        }
        if (icon === "fox") {
          c.fillStyle = "#fff4e2";
          blob(x, y + 0.42 * s, 0.55 * s, 0.38 * s);
        }
        if (icon === "pig") {
          c.fillStyle = color;
          blob(x, y + 0.32 * s, 0.38 * s, 0.26 * s);
        }
        if (icon === "duck" || icon === "penguin") {
          c.fillStyle = "#f2a65a";
          blob(x, y + 0.36 * s, (icon === "duck" ? 0.42 : 0.22) * s, 0.18 * s);
        }
        if (icon === "dog")
          for (const k of [-1, 1]) {
            c.fillStyle = color;
            blob(x + k * 0.95 * s, y + 0.05 * s, 0.3 * s, 0.6 * s, -k * 0.3);
          }
        c.fillStyle = "#3a2a1a";
        for (const k of [-1, 1]) {
          c.beginPath();
          c.arc(x + k * 0.38 * s, y - 0.12 * s, 0.13 * s, 0, Math.PI * 2);
          c.fill();
        }
        if (icon === "pig")
          for (const k of [-1, 1]) {
            c.beginPath();
            c.arc(x + k * 0.12 * s, y + 0.32 * s, 0.06 * s, 0, Math.PI * 2);
            c.fill();
          }
        else if (icon !== "duck" && icon !== "penguin") {
          c.beginPath();
          c.arc(x, y + 0.28 * s, 0.11 * s, 0, Math.PI * 2);
          c.fill();
        }
      }

      function drawScreen() {
        const c = sctx;
        c.fillStyle = "#14233d";
        c.fillRect(0, 0, SW, SH);
        c.fillStyle = "#2a6fdb";
        c.fillRect(TRACK.x, TRACK.y, TRACK.w, TRACK.h);
        c.fillStyle = "#4b8cf0";
        for (let i = 0; i < 6; i++)
          c.fillRect(TRACK.x, TRACK.y + 20 + i * 48, TRACK.w, 2);
        c.fillStyle = "#222";
        c.fillRect(METER.x, METER.y, METER.w, METER.h);
        c.textAlign = "center";
        const y = (n) => TRACK.y + TRACK.h - n * TRACK.h;
        const mg = game.mg;

        if (mg) {
          const bh = mg.tier.barHeight * TRACK.h;
          c.fillStyle = "rgba(94,224,94,0.55)";
          c.fillRect(TRACK.x + 4, y(mg.barPos) - bh, TRACK.w - 8, bh);
          c.strokeStyle = "#5ee05e";
          c.lineWidth = 2;
          c.strokeRect(TRACK.x + 4, y(mg.barPos) - bh, TRACK.w - 8, bh);
          drawPlushIcon(
            c,
            mg.animal.icon,
            mg.tier.css,
            TRACK.x + TRACK.w / 2,
            y(mg.fishPos),
            11,
          );
          const p = mg.progress;
          c.fillStyle = `hsl(${p * 120},80%,50%)`;
          c.fillRect(
            METER.x + 2,
            METER.y + METER.h - p * METER.h,
            METER.w - 4,
            p * METER.h,
          );
          // time remaining
          c.fillStyle = "#ffd75e";
          c.fillRect(
            TRACK.x,
            SH - 8,
            TRACK.w * Math.max(0, 1 - mg.t / MG.timeLimit),
            4,
          );
          c.font = '12px "Press Start 2P", monospace';
          if (mg.result) {
            const label = {
              caught: mg.perfect ? "PERFECT!" : "CAUGHT!",
              slipped: "SLIPPED",
              escaped: "ESCAPED",
              timeout: "TIME!",
            };
            c.fillStyle = "#3a2a1a";
            c.fillText(label[mg.result], TRACK.x + TRACK.w / 2 + 2, 42);
            c.fillStyle = "#ffd75e";
            c.fillText(label[mg.result], TRACK.x + TRACK.w / 2, 40);
          } else {
            c.font = '8px "Press Start 2P", monospace';
            c.fillStyle = mg.tier.css;
            c.fillText(`${mg.tier.points} PTS`, TRACK.x + TRACK.w / 2, 34);
          }
        } else {
          c.font = '11px "Press Start 2P", monospace';
          c.fillStyle = "#ffd75e";
          const lines = MODE_TEXT[game.mode] ?? IDLE_TEXT[game.state] ?? [];
          lines.forEach((l, i) =>
            c.fillText(l, TRACK.x + TRACK.w / 2, SH / 2 - 20 + i * 18),
          );
        }
        screenTex.needsUpdate = true;
      }

      // ---------- render sync ----------

      function sync(now) {
        for (const b of plushies) {
          // Squash keeps the volume and sinks a little so the plushie stays on the floor.
          const a = b.squash.a;
          b.root.position.copy(b.body.position);
          b.root.position.y -= a * 0.35;
          b.root.scale.set(1 + a / 2, 1 - a, 1 + a / 2);
          b.group.quaternion.copy(b.body.quaternion);
        }
        hubMesh.position.copy(hub.position);
        for (const p of prongs) {
          p.mesh.position.copy(p.body.position);
          p.mesh.quaternion.copy(p.body.quaternion);
        }
        carriage.position.set(hub.position.x, 8.55, hub.position.z);
        bridge.position.z = hub.position.z;
        const cableTop = 7.9;
        const cableBottom = hub.position.y + 0.2;
        cable.scale.y = Math.max(0.01, cableTop - cableBottom);
        cable.position.set(
          hub.position.x,
          (cableTop + cableBottom) / 2,
          hub.position.z,
        );

        // The cabinet lamp slowly cycles through the pastels after a clear.
        const party =
          game.mode === "clear" ||
          (game.mode === "over" && game.result?.cleared);
        if (party) lamp.color.setHSL((now / 4000) % 1, 0.7, 0.75);
        else lamp.color.setHex(LAMP_COLOR);

        const ix = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
        const iz = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
        stick.rotation.set(iz * 0.35, 0, -ix * 0.35);
        reelButton.position.y = keys.Space ? -0.07 : -0.02;
      }

      // ---------- sound ----------

      // Everything is synthesised with Web Audio: no files to load. Browsers (iPhone especially)
      // only start audio after a tap or key press, so the context is created on the first one.
      const SOUND_KEY = "startclaw.sound.v1";
      const sound = { music: true, sfx: true };
      try {
        Object.assign(sound, JSON.parse(localStorage.getItem(SOUND_KEY)));
      } catch {}
      const MUSIC_VOL = 0.32;
      let ac = null;
      let sfxBus;
      let musicBus;
      let noiseBuf;
      let motor;
      let musicLevel = 1;

      function audioOn() {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          // Lets iPhones play through the silent switch, like a game should.
          try {
            if (navigator.audioSession)
              navigator.audioSession.type = "playback";
          } catch {}
          ac = new AC();
          const comp = ac.createDynamicsCompressor();
          comp.connect(ac.destination);
          const master = ac.createGain();
          master.gain.value = 0.7;
          master.connect(comp);
          sfxBus = ac.createGain();
          sfxBus.connect(master);
          musicBus = ac.createGain();
          musicBus.connect(master);
          noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          // The gantry motor: a low filtered buzz whose volume follows the claw's speed.
          const osc = ac.createOscillator();
          osc.type = "sawtooth";
          osc.frequency.value = 62;
          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 320;
          motor = ac.createGain();
          motor.gain.value = 0;
          osc.connect(lp).connect(motor).connect(sfxBus);
          osc.start();
          applySound();
        }
        if (ac.state !== "running") ac.resume();
        if (sound.music) startMusic();
        return ac;
      }
      for (const ev of ["pointerdown", "pointerup", "keydown", "touchend"])
        addEventListener(ev, audioOn, { capture: true });

      function applySound() {
        if (!ac) return;
        const now = ac.currentTime;
        sfxBus.gain.setTargetAtTime(sound.sfx ? 1 : 0, now, 0.02);
        musicBus.gain.setTargetAtTime(
          sound.music ? MUSIC_VOL * musicLevel : 0,
          now,
          0.15,
        );
      }
      function setMusicLevel(level) {
        musicLevel = level;
        applySound();
      }
      function toggleSound(kind) {
        sound[kind] = !sound[kind];
        try {
          localStorage.setItem(SOUND_KEY, JSON.stringify(sound));
        } catch {}
        audioOn();
        applySound();
        renderSoundButtons();
        if (kind === "sfx" && sound.sfx) sfx.click();
      }
      const soundEl = document.getElementById("sound");
      function renderSoundButtons() {
        for (const b of soundEl.querySelectorAll("button[data-sound]")) {
          const on = sound[b.dataset.sound];
          b.classList.toggle("off", !on);
          b.setAttribute("aria-pressed", String(on));
          b.title = `${b.dataset.sound === "music" ? "Music" : "Sound effects"} ${on ? "on" : "off"} (${b.dataset.sound === "music" ? "M" : "S"})`;
        }
      }
      addEventListener("pointerdown", (e) => {
        if (e.target.closest("button:not([data-sound])")) sfx.click();
      });
      soundEl.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-sound]");
        if (b) toggleSound(b.dataset.sound);
      });
      renderSoundButtons();

      const hz = (midi) => 440 * 2 ** ((midi - 69) / 12);

      // One enveloped oscillator. `at` is an absolute time (for the music); otherwise `t` seconds from now.
      function tone({
        f,
        f2,
        type = "square",
        t = 0,
        at,
        dur = 0.12,
        vol = 0.15,
        attack = 0.005,
        bus,
      }) {
        if (!ac || ac.state !== "running") return;
        const t0 = at ?? ac.currentTime + t;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t0);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(bus ?? sfxBus);
        o.start(t0);
        o.stop(t0 + dur + 0.05);
      }
      function noise({
        t = 0,
        at,
        dur = 0.08,
        vol = 0.15,
        freq = 2000,
        f2,
        q = 1,
        type = "bandpass",
        bus,
      }) {
        if (!ac || ac.state !== "running") return;
        const t0 = at ?? ac.currentTime + t;
        const src = ac.createBufferSource();
        src.buffer = noiseBuf;
        const filter = ac.createBiquadFilter();
        filter.type = type;
        filter.Q.value = q;
        filter.frequency.setValueAtTime(freq, t0);
        if (f2) filter.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
        const g = ac.createGain();
        g.gain.setValueAtTime(vol, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src
          .connect(filter)
          .connect(g)
          .connect(bus ?? sfxBus);
        src.start(t0, Math.random() * 0.5);
        src.stop(t0 + dur + 0.05);
      }
      const notes = (list, step, o = {}) =>
        list.forEach(
          (m, i) => m && tone({ f: hz(m), t: i * step, dur: step * 1.6, ...o }),
        );

      const sfx = {
        click: () => tone({ f: 1200, f2: 900, dur: 0.04, vol: 0.06 }),
        blip: () => notes([79, 84], 0.06, { vol: 0.08 }),
        coinIn: () => notes([72, 76, 79, 84, 88], 0.06, { vol: 0.1 }),
        drop: () => {
          tone({ f: 520, f2: 180, dur: 0.35, vol: 0.06, type: "triangle" });
          noise({ dur: 0.05, vol: 0.05, freq: 900 });
        },
        clack: () => {
          noise({ dur: 0.05, vol: 0.18, freq: 1400, q: 3 });
          tone({ f: 260, f2: 120, dur: 0.07, vol: 0.08 });
        },
        lift: () =>
          tone({ f: 140, f2: 280, dur: 0.6, vol: 0.05, type: "triangle" }),
        release: () => {
          noise({ dur: 0.04, vol: 0.12, freq: 2200, q: 4 });
          tone({ f: 600, f2: 900, dur: 0.08, vol: 0.06, type: "triangle" });
        },
        empty: () =>
          notes([67, 63], 0.14, { vol: 0.07, type: "triangle", dur: 0.25 }),
        reelStart: () => notes([76, 79, 76, 79, 83], 0.05, { vol: 0.08 }),
        inBar: () =>
          tone({ f: 1320, dur: 0.08, vol: 0.06, type: "sine", attack: 0.002 }),
        outBar: () => tone({ f: 150, f2: 110, dur: 0.12, vol: 0.07 }),
        ratchet: (p) =>
          tone({
            f: 300 + p * 900,
            dur: 0.035,
            vol: 0.05,
            type: "triangle",
          }),
        slack: (p) => tone({ f: 200 + p * 200, f2: 120, dur: 0.05, vol: 0.04 }),
        caught: (perfect) => {
          notes([72, 76, 79, 84], 0.07, { vol: 0.1 });
          if (perfect)
            notes([0, 0, 0, 0, 88, 91, 96], 0.05, {
              vol: 0.06,
              type: "triangle",
            });
        },
        escaped: () =>
          notes([67, 66, 65, 64], 0.13, {
            vol: 0.08,
            type: "sawtooth",
            dur: 0.2,
          }),
        slipped: () =>
          tone({ f: 500, f2: 160, dur: 0.4, vol: 0.07, type: "triangle" }),
        // Bigger tiers get a longer, higher jingle.
        prize: (tierIndex, streak) => {
          const up = Math.min(streak, 6);
          tone({ f: hz(83 + up), dur: 0.08, vol: 0.09 });
          tone({ f: hz(88 + up), t: 0.08, dur: 0.3, vol: 0.09 });
          const extra = [76, 79, 84, 88, 91].slice(0, tierIndex + 1);
          notes(
            extra.map((m) => m + up),
            0.06,
            {
              vol: 0.05,
              type: "triangle",
              t: 0,
            },
          );
        },
        fresh: () =>
          [96, 100, 103, 108].forEach((m, i) =>
            tone({
              f: hz(m),
              t: 0.35 + i * 0.05,
              dur: 0.15,
              vol: 0.04,
              type: "sine",
            }),
          ),
        plop: () =>
          tone({ f: 700, f2: 260, dur: 0.09, vol: 0.09, type: "sine" }),
        heal: () =>
          notes([79, 83, 86], 0.06, { vol: 0.06, type: "sine", t: 0.2 }),
        hurt: (full) => {
          tone({ f: 330, f2: 160, dur: 0.18, vol: 0.09 });
          if (full) tone({ f: 250, f2: 110, t: 0.18, dur: 0.25, vol: 0.09 });
        },
        lost: () =>
          notes([72, 71, 70, 69, 0, 64, 0, 60], 0.16, {
            vol: 0.08,
            type: "triangle",
            dur: 0.3,
          }),
        cashOut: () =>
          notes([84, 0, 88, 84, 91], 0.08, { vol: 0.08, type: "square" }),
        fanfare: () => {
          notes([72, 72, 72, 76, 0, 72, 76, 79], 0.1, { vol: 0.09 });
          notes([60, 0, 0, 64, 0, 0, 67, 72], 0.1, {
            vol: 0.06,
            type: "triangle",
            dur: 0.3,
          });
        },
        cleared: () => {
          sfx.fanfare();
          notes([84, 88, 91, 96, 91, 96, 100, 103, 108], 0.08, {
            vol: 0.06,
            type: "triangle",
            t: 0.9,
          });
        },
        saved: () => notes([79, 84, 88], 0.07, { vol: 0.07, type: "sine" }),
      };

      function setMotor(speed) {
        if (!motor) return;
        motor.gain.setTargetAtTime(
          Math.min(1, speed / 4) * 0.12,
          ac.currentTime,
          0.06,
        );
      }

      // ---------- music ----------

      // A loop of 16 bars of 16 steps: an 8-bar tune, then 8 bars of just groove so it never nags.
      // Chords C, Am, F, G. Notes are [step, midi, length in steps].
      const BPM = 132;
      const STEP = 60 / BPM / 4;
      const CHORDS = [
        [48, 52, 55],
        [45, 48, 52],
        [41, 45, 48],
        [43, 47, 50],
      ];
      const TUNE = [
        [
          [0, 76, 2],
          [2, 79, 2],
          [4, 84, 4],
          [8, 83, 2],
          [10, 79, 2],
          [12, 76, 4],
        ],
        [
          [0, 81, 4],
          [4, 79, 2],
          [6, 76, 2],
          [8, 72, 4],
          [12, 74, 2],
          [14, 76, 2],
        ],
        [
          [0, 77, 2],
          [2, 81, 2],
          [4, 84, 4],
          [8, 81, 2],
          [10, 77, 2],
          [12, 81, 4],
        ],
        [
          [0, 79, 6],
          [6, 77, 2],
          [8, 76, 2],
          [10, 74, 2],
          [12, 71, 2],
          [14, 74, 2],
        ],
        [
          [0, 76, 2],
          [2, 79, 2],
          [4, 84, 4],
          [8, 83, 2],
          [10, 79, 2],
          [12, 76, 4],
        ],
        [
          [0, 81, 2],
          [2, 84, 2],
          [4, 88, 4],
          [8, 86, 2],
          [10, 84, 2],
          [12, 81, 4],
        ],
        [
          [0, 77, 2],
          [2, 79, 2],
          [4, 81, 2],
          [6, 84, 2],
          [8, 86, 4],
          [12, 84, 4],
        ],
        [
          [0, 83, 4],
          [4, 81, 2],
          [6, 83, 2],
          [8, 86, 8],
        ],
      ];
      const music = { on: false, step: 0, next: 0, timer: 0 };
      function startMusic() {
        if (music.on || !ac) return;
        music.on = true;
        music.step = 0;
        music.next = ac.currentTime + 0.1;
        music.timer = setInterval(scheduleMusic, 25);
      }
      function scheduleMusic() {
        if (ac.state !== "running") return;
        // Behind (tab was hidden): skip ahead instead of firing a burst of notes.
        if (music.next < ac.currentTime) music.next = ac.currentTime + 0.05;
        while (music.next < ac.currentTime + 0.12) {
          playStep(music.step, music.next);
          music.step = (music.step + 1) % (16 * 16);
          music.next += STEP;
        }
      }
      function playStep(n, at) {
        if (!sound.music) return;
        const bar = Math.floor(n / 16);
        const s = n % 16;
        const chord = CHORDS[bar % 4];
        const tuneBar = bar < 8 ? TUNE[bar] : null;
        const bus = musicBus;
        // Bass: bouncy root / octave eighths.
        if (s % 2 === 0)
          tone({
            f: hz(chord[0] - 12 + (s % 4 === 2 ? 12 : 0)),
            at,
            dur: STEP * 1.6,
            vol: 0.22,
            type: "triangle",
            bus,
          });
        // Drums.
        if (s === 0 || s === 8 || (s === 10 && bar % 2))
          tone({ f: 150, f2: 45, at, dur: 0.14, vol: 0.5, type: "sine", bus });
        if (s === 4 || s === 12)
          noise({ at, dur: 0.12, vol: 0.18, freq: 1800, q: 0.8, bus });
        if (s % 2 === 0)
          noise({
            at,
            dur: 0.03,
            vol: s % 4 ? 0.05 : 0.08,
            freq: 8000,
            type: "highpass",
            bus,
          });
        // Arpeggio: a soft sparkle in the groove half, a whisper under the tune.
        const arp = chord[[0, 1, 2, 1][s % 4]] + 24;
        tone({
          f: hz(arp),
          at,
          dur: STEP * 0.9,
          vol: tuneBar ? 0.025 : 0.05,
          bus,
        });
        if (tuneBar)
          for (const [st, m, len] of tuneBar)
            if (st === s)
              tone({
                f: hz(m),
                at,
                dur: STEP * len * 0.95,
                vol: 0.09,
                attack: 0.01,
                bus,
              });
      }

      // ---------- loop ----------

      const FIXED = 1 / 120;
      let acc = 0;
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (!game.paused) {
          acc += dt;
          while (acc >= FIXED) {
            tick(FIXED);
            driveProngs();
            world.step(FIXED);
            jiggle(FIXED);
            acc -= FIXED;
          }
        }
        sync(now);
        const hv = hub.velocity;
        setMotor(
          game.paused ? 0 : Math.hypot(hv.x, hv.z) + Math.abs(hv.y) * 0.5,
        );
        drawScreen();
        tallyScore(dt);
        stepFx(dt);
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      addEventListener("resize", resize);
      resize();
      document.fonts.load('16px "Press Start 2P"').then(() => drawMarquee());
      restock();
      setMode("title");
      setState("settle");
      renderHud();
      renderTitle();
      try {
        if (!localStorage.getItem(HOWTO_KEY)) openHelp();
      } catch {}
      fetchWorld();
      requestAnimationFrame(frame);

      // Debug handle for playtesting from the console.
      window.__claw = {
        game,
        hub,
        plushies,
        prongs,
        claw,
        keys,
        pressed,
        CLAW,
        GRIP,
        MG,
        RULES,
        TIERS,
        startGame,
      };
    </script>
  </body>
</html>
