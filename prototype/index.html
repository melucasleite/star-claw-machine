    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Star Claw",
        "url": "https://star-claw-machine.vercel.app/",
        "description": "Grab knitted plushies in a free claw machine you play in the browser. Win the reel, fill your prize bag, collect all 50 and climb the world top 10. Works on phones and desktop.",
        "image": "https://star-claw-machine.vercel.app/og.png",
        "genre": ["Arcade", "Casual"],
        "gamePlatform": ["Web browser", "iOS", "Android"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --wood: #7a4e2d;
        --wood-dark: #3a2a1a;
        --teal: #1f6f6b;
        --mustard: #d9a521;
        --gold: #ffd75e;
        --heart: #f7a8b8;
        --danger: #f07470;
        --bg: #2b1d14;
        --ink: #fff4dc;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Press Start 2P", monospace;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      * {
        touch-action: none;
      }
      /* Dialogs scroll with a finger; the rest of the page is a game surface. */
      .panel,
      .panel * {
        touch-action: pan-y;
      }
      button,
      .panel button {
        touch-action: manipulation;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #quit {
        align-self: flex-start;
        font: inherit;
        font-size: 9px;
        padding: 8px 12px;
        color: var(--ink);
        background: var(--teal);
        border: 3px solid var(--wood-dark);
        border-radius: 999px;
        text-shadow: none;
        cursor: pointer;
      }
      body:not([data-mode="play"]) #quit {
        visibility: hidden;
      }
      /* The reel game pops up in the middle of the screen, and only while something is hooked. */
      .carriage {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 15;
        background: var(--wood);
        border: 4px solid var(--wood-dark);
        border-radius: 14px;
        padding: 16px 24px;
        box-shadow:
          0 0 0 4px var(--mustard),
          0 18px 40px rgba(0, 0, 0, 0.45);
        transform: translate(-50%, -50%) scale(0.6);
        opacity: 0;
        visibility: hidden;
        transition:
          transform 0.25s ease-out,
          opacity 0.2s ease-out,
          visibility 0s 0.25s;
      }
      body.reeling .carriage {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        visibility: visible;
        transition:
          transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1),
          opacity 0.15s ease-out;
      }
      .bezel {
        background: var(--mustard);
        border: 3px solid var(--wood-dark);
        border-radius: 6px;
        padding: 6px;
      }
      #screen {
        display: block;
        height: min(60vh, 480px);
        width: auto;
        aspect-ratio: 170 / 320;
        image-rendering: pixelated;
        touch-action: none;
      }

      /* ---------- scoreboard ---------- */
      #scoreboard {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-shadow: 2px 2px 0 var(--wood-dark);
      }
      #bag {
        pointer-events: none;
        box-sizing: border-box;
        width: 196px;
        min-height: 64px;
        margin-top: 4px;
        padding: 6px 8px 10px;
        color: var(--wood-dark);
        text-shadow: none;
        background:
          repeating-linear-gradient(
            45deg,
            rgba(0, 0, 0, 0.05) 0 3px,
            transparent 3px 6px
          ),
          #d8b47a;
        border: 3px solid var(--wood-dark);
        border-top-width: 6px;
        border-radius: 8px 8px 28px 28px;
        transform-origin: top center;
      }
      #bag.bump {
        animation: bag-bump 0.45s ease-out;
      }
      @keyframes bag-bump {
        35% {
          transform: scale(1.06, 0.94);
        }
        70% {
          transform: scale(0.98, 1.03);
        }
      }
      .bag-label {
        display: flex;
        justify-content: space-between;
        font-size: 8px;
        margin-bottom: 4px;
      }
      #bag-items {
        display: flex;
        flex-wrap: wrap;
        gap: 1px;
        min-height: 26px;
      }
      #bag-items:empty::after {
        content: "empty... for now";
        font-size: 7px;
        opacity: 0.6;
        align-self: center;
      }
      .prize-icon {
        width: 26px;
        height: 26px;
      }
      .prize-icon.fresh {
        filter: drop-shadow(0 0 3px #fff6b0);
      }
      .prize-flyer {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 30;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        pointer-events: none;
      }
      .haul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2px;
        margin: 6px auto 10px;
        max-width: 420px;
      }
      .haul .prize-icon {
        width: 34px;
        height: 34px;
      }
      .collection {
        font-size: 9px;
        opacity: 0.85;
      }
      body[data-mode="title"] #scoreboard {
        visibility: hidden;
      }
      #scoreboard .label {
        font-size: 10px;
        opacity: 0.8;
      }
      #score {
        font-size: 30px;
        color: var(--gold);
        transform-origin: left center;
        transition: transform 0.25s ease-out;
      }
      #score.bump {
        transform: scale(1.12);
        transition: none;
      }
      #scoreboard .meta {
        display: flex;
        gap: 14px;
        font-size: 9px;
        opacity: 0.85;
      }
      #streak {
        font-size: 10px;
        color: var(--gold);
        min-height: 1em;
      }
      #hearts {
        display: flex;
        gap: 5px;
      }
      #hearts.hurt {
        animation: hurt 0.6s ease-out;
      }
      #hearts.heal {
        animation: heal 0.6s ease-out;
      }
      @keyframes heal {
        30% {
          transform: scale(1.15);
          filter: brightness(1.4);
        }
      }
      @keyframes hurt {
        0%,
        50% {
          opacity: 0.35;
        }
        25%,
        100% {
          opacity: 1;
        }
      }
      .heart {
        position: relative;
        display: inline-block;
        width: 21px;
        height: 18px;
        filter: drop-shadow(2px 2px 0 var(--wood-dark));
      }
      .heart svg {
        display: block;
        width: 21px;
        height: 18px;
        fill: var(--heart);
      }
      .heart svg.empty {
        fill: rgba(255, 244, 220, 0.2);
      }
      .heart .fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        overflow: hidden;
      }
      svg.inline {
        display: inline-block;
        width: 11px;
        height: 10px;
        fill: var(--heart);
        vertical-align: -1px;
      }

      #sound {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 25;
        display: flex;
        gap: 8px;
      }
      #sound button {
        position: relative;
        width: 40px;
        height: 40px;
        padding: 9px;
        color: var(--wood-dark);
        background: var(--mustard);
        border: 3px solid var(--wood-dark);
        border-radius: 999px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #sound button[data-help] {
        padding: 0;
        font: inherit;
        font-size: 15px;
        line-height: 1;
      }
      #howto {
        z-index: 22;
      }
      #howto h1 {
        margin-bottom: 0;
      }
      #howto h2 {
        margin: 14px 0 0;
      }
      #howto p {
        margin-top: 8px;
        line-height: 1.7;
      }
      #howto .steps {
        margin: 12px auto 0;
      }
      #howto .tiers {
        margin-top: 8px;
      }
      #howto .tiers div {
        padding: 5px 2px;
      }
      .panel > .actions:last-child {
        position: sticky;
        bottom: calc(-1 * var(--pad-y));
        margin: 12px calc(-1 * var(--pad-x)) calc(-1 * var(--pad-y));
        padding: 12px 0 16px;
        background: var(--teal);
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0 auto 14px;
        max-width: 520px;
      }
      .step {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 9px 6px;
        font-size: 8px;
        line-height: 1.5;
        background: rgba(20, 35, 61, 0.35);
        border-radius: 8px;
      }
      .step svg {
        width: 32px;
        height: 32px;
      }
      .step b {
        font-weight: normal;
        font-size: 11px;
        color: var(--gold);
      }
      .step .n {
        position: absolute;
        top: 6px;
        left: 8px;
        opacity: 0.6;
      }
      .aside {
        font-size: 8px;
        opacity: 0.75;
      }
      #sound svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      #sound button.off {
        background: #8a7a5c;
        opacity: 0.75;
      }
      #sound button.off::after {
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        top: 50%;
        height: 3px;
        background: var(--wood-dark);
        transform: rotate(-45deg);
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 5px;
        border-radius: 50%;
        border: 2px solid var(--wood-dark);
        vertical-align: -2px;
      }

      /* ---------- popups and confetti ---------- */
      #popups {
        position: fixed;
        top: 22%;
        left: calc(50% - 130px);
        z-index: 10;
        pointer-events: none;
      }
      .popup {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateX(-50%);
        text-align: center;
        white-space: nowrap;
        animation: float 2.2s ease-out forwards;
        text-shadow: 3px 3px 0 var(--wood-dark);
      }
      .popup b {
        display: block;
        font-size: 32px;
        font-weight: normal;
      }
      .popup small {
        display: block;
        margin-top: 10px;
        font-size: 9px;
        color: var(--ink);
      }
      .popup.big b {
        font-size: 44px;
      }
      @keyframes float {
        0% {
          opacity: 0;
          transform: translate(-50%, 10px) scale(0.7);
        }
        12% {
          opacity: 1;
          transform: translate(-50%, 0) scale(1.08);
        }
        22% {
          transform: translate(-50%, 0) scale(1);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -46px) scale(1);
        }
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 30;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* ---------- overlays ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(30, 20, 12, 0.55);
      }
      .overlay[hidden] {
        display: none;
      }
      .panel {
        --pad-y: 22px;
        --pad-x: 20px;
        box-sizing: border-box;
        width: min(600px, 100%);
        max-height: calc(100dvh - 40px);
        overflow: auto;
        overscroll-behavior: contain;
        padding: var(--pad-y) var(--pad-x);
        text-align: center;
        background: var(--teal);
        border: 4px solid var(--wood-dark);
        border-radius: 14px;
        box-shadow:
          0 0 0 4px var(--mustard),
          0 0 0 8px var(--wood-dark),
          0 18px 40px rgba(0, 0, 0, 0.45);
        animation: panel-in 0.35s ease-out;
      }
      .panel.small {
        width: min(360px, 100%);
      }
      @keyframes panel-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.97);
        }
      }
      .panel h1,
      .panel h2 {
        margin: 0;
        font-weight: normal;
        text-shadow: 3px 3px 0 var(--wood-dark);
      }
      .panel h1 {
        font-size: 24px;
        line-height: 1.4;
        color: var(--gold);
      }
      .panel h1.lost {
        font-size: 18px;
        color: var(--danger);
      }
      .panel h1.win {
        font-size: 20px;
      }
      .panel h2 {
        margin: 20px 0 10px;
        font-size: 11px;
        color: var(--gold);
      }
      .panel p {
        margin: 12px 0 0;
        font-size: 9px;
        line-height: 1.8;
      }
      .panel p.hey {
        margin-top: 6px;
        font-size: 11px;
        color: var(--gold);
      }
      .tiers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 18px;
        font-size: 8px;
      }
      .tiers div {
        padding: 8px 2px;
        border-radius: 8px;
        background: rgba(20, 35, 61, 0.45);
        line-height: 1.8;
      }
      .tiers .dot {
        display: block;
        width: 16px;
        height: 16px;
        margin: 0 auto 6px;
      }
      .tiers b {
        display: block;
        font-weight: normal;
        font-size: 10px;
        color: var(--gold);
      }
      .final {
        margin-top: 16px;
        font-size: 10px;
      }
      .final b {
        display: block;
        margin-top: 8px;
        font-size: 34px;
        font-weight: normal;
        color: var(--gold);
        text-shadow: 3px 3px 0 var(--wood-dark);
      }
      .board {
        margin: 0 auto;
        padding: 0;
        max-width: 300px;
        list-style: none;
        font-size: 10px;
      }
      .board li {
        display: grid;
        grid-template-columns: 2.4em 1fr auto;
        padding: 7px 10px;
        text-align: left;
        border-radius: 6px;
      }
      .board li:nth-child(odd) {
        background: rgba(20, 35, 61, 0.35);
      }
      .board li.you {
        color: var(--gold);
        background: rgba(255, 215, 94, 0.2);
      }
      .boards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0 18px;
        align-items: start;
      }
      .board .empty,
      .boards .empty {
        opacity: 0.75;
        font-size: 9px;
      }
      form.name {
        margin-top: 18px;
      }
      form.name label {
        display: block;
        font-size: 9px;
        margin-bottom: 10px;
      }
      form.name .row {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .name input {
        width: 11ch;
        padding: 10px;
        font: inherit;
        font-size: 13px;
        text-align: center;
        text-transform: uppercase;
        color: var(--gold);
        background: #14233d;
        border: 3px solid var(--wood-dark);
        border-radius: 8px;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
        touch-action: manipulation;
      }
      .name input:focus {
        border-color: var(--gold);
      }
      .btn {
        font: inherit;
        font-size: 11px;
        padding: 11px 16px;
        color: var(--wood-dark);
        background: var(--mustard);
        border: 3px solid var(--wood-dark);
        border-radius: 999px;
        box-shadow: 0 4px 0 var(--wood-dark);
        cursor: pointer;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--wood-dark);
      }
      .btn.big {
        margin-top: 22px;
        padding: 14px 24px;
        font-size: 13px;
      }
      .btn.ghost {
        color: var(--ink);
        background: transparent;
        border-color: var(--ink);
        box-shadow: none;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
      }

      @media (max-width: 700px) {
        #scoreboard {
          top: calc(12px + env(safe-area-inset-top));
          left: calc(12px + env(safe-area-inset-left));
          gap: 6px;
        }
        #score {
          font-size: 20px;
        }
        #bag {
          width: 132px;
          min-height: 0;
          padding: 4px 6px 7px;
          border-top-width: 4px;
          border-radius: 6px 6px 18px 18px;
        }
        #bag-items {
          min-height: 19px;
        }
        .bag-label {
          font-size: 7px;
          margin-bottom: 2px;
        }
        #bag .prize-icon {
          width: 19px;
          height: 19px;
        }
        .heart,
        .heart svg {
          width: 16px;
          height: 14px;
        }
        #popups {
          left: 50%;
          top: 26%;
        }
        .popup b {
          font-size: 24px;
        }
        .popup.big b {
          font-size: 30px;
        }
        .carriage {
          padding: 10px 14px;
        }
        #sound {
          top: calc(12px + env(safe-area-inset-top));
          right: calc(12px + env(safe-area-inset-right));
          bottom: auto;
          gap: 6px;
        }
        #sound button {
          width: 36px;
          height: 36px;
          padding: 8px;
        }
        .panel {
          --pad-y: 18px;
          --pad-x: 14px;
        }
        .panel h1 {
          font-size: 19px;
        }
        .panel h1.lost {
          font-size: 14px;
        }
        .tiers {
          font-size: 7px;
        }
        #howto .panel {
          --pad-y: 14px;
          --pad-x: 12px;
        }
        #howto h1 {
          font-size: 16px;
        }
        #howto h2 {
          margin-top: 10px;
          font-size: 10px;
        }
        #howto p {
          margin-top: 6px;
          font-size: 8px;
          line-height: 1.6;
        }
        #howto .steps {
          margin-top: 8px;
        }
        .panel > .actions:last-child {
          margin-top: 8px;
          padding: 8px 0 12px;
        }
      }
      /* Short screens (iPhone SE and friends): squeeze the help sheet a little more. */
      @media (max-height: 620px) {
        #howto .step {
          padding: 6px 4px;
          gap: 3px;
        }
        #howto .step svg {
          width: 24px;
          height: 24px;
        }
        #howto .tiers div {
          padding: 3px 2px;
        }
      }
      @media (max-height: 500px) and (min-width: 701px) {
        #screen {
          height: 76vh;
        }
      }
      /* Dual-screen / folding phones spanned across the hinge (resize() sets the class and the
         second screen's rect): the cabinet stays centred, dialogs and the reel game use the second screen. */
      body.spanned .overlay {
        box-sizing: border-box;
        inset: auto;
        left: var(--seg2-x);
        top: var(--seg2-y);
        width: var(--seg2-w);
        height: var(--seg2-h);
      }
      /* The reel sits against the far edge of the second screen, clear of the scoreboard. */
      body.spanned .carriage {
        left: calc(var(--seg2-x) + var(--seg2-w) - 20px);
        top: calc(var(--seg2-y) + var(--seg2-h) / 2);
        transform: translate(-100%, -50%) scale(0.6);
      }

      // ---------- cabinet ----------

      const ground = new THREE.Mesh(

      const stick = new THREE.Group();

      const reelRing = new THREE.Mesh(

      const cable = new THREE.Mesh(
